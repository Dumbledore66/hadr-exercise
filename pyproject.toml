[project]
name = "hadr-starter"
version = "0.1.0"
description = "Student starter template for the HADR dispatch course"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28.0",
    "openai>=2.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
hadr-runner = "hadr_agent.runner:main"
hadr-agent = "hadr_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hadr_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PL"]
ignore = [
  "PLR2004",  # magic-value comparisons read clearly in this small agent code
  "PLR0913",  # constructors/handlers legitimately take several arguments
  "PLR0911",  # tool/command dispatch reads clearly as a chain of guarded returns
  "PLC0415",  # deferred imports are deliberate (optional deps, fast startup)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"features/**" = ["PLR2004", "F811"]  # behave re-binds step names by design

[tool.pyright]
include = ["src", "tests", "features"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# mcp, openai, and behave ship without complete type stubs; treat them as untyped rather than error.
reportMissingTypeStubs = false
# The agent speaks JSON (dict/list) and leans on stub-less libraries, so the strict "Unknown-type"
# family fires on nearly every line without catching real bugs. We keep every strict check that
# finds actual defects and relax only the inference-completeness rules below.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false      # untyped pytest/behave fixtures (context, capsys)
reportMissingTypeArgument = false       # bare dict/list annotations are pervasive and readable
# This is a student template: helpers, imports, and locals for not-yet-wired exercise holes
# are intentionally unreferenced (they already carry ruff noqa markers for the same reason).
reportUnusedFunction = false
reportUnusedImport = false
reportUnusedVariable = false

# behave step functions receive an untyped `context` and reach into scenario internals; the
# value-level checks below are impractical there while staying fully active for src/.
[[tool.pyright.executionEnvironments]]
root = "features"
reportArgumentType = false
reportOperatorIssue = false
reportPrivateUsage = false

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
