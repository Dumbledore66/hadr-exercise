[behave]
# No default tag exclusion: a fresh clone runs every scenario and FAILS, because
# the spec is written before the code - the requirements are failing tests you turn
# green. Gate only the built stages in CI with an explicit --tags expression, and
# ease it as each stage lands. Tags: @warmup (stores), @stage1 (agent loop, dispatch,
# and the _finalize gate the zero-token claim path runs through), @stage2 (the intake
# prompt - you write those scenarios), @stage3 (reconcile).
show_skipped = false
